image: https://cdn.prod.website-files.com/68994d4ecac027f80ff70510/692cf1d4d7bea7f25053a45c_Blank%20Open%20Graph.png

description: Loft Labs, now operating as vCluster Labs, provides a platform for AI cloud providers to deliver managed Kubernetes, Slurm, and inference
  clusters with tenant isolation. Their solution enables turnkey AI infrastructure, offering both bare‑metal and virtual machine provisioning,
  multi‑tenant management, capacity planning, and observability. The company targets AI cloud providers, enterprises, and hyperscalers seeking
  scalable, secure compute clusters, and also offers vMetal to expose physical resources as a cloud service.

